[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-quality-auditor"
version = "0.2.0"
description = "CLI-first deterministic dataset readiness auditor for tabular ML datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dataset Quality Auditor contributors" },
]
keywords = ["machine-learning", "data-quality", "datasets", "audit", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "rich>=13.7",
    "typer>=0.12",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Aryamanjmwl/dataset-quality-auditor"
Repository = "https://github.com/Aryamanjmwl/dataset-quality-auditor"
Issues = "https://github.com/Aryamanjmwl/dataset-quality-auditor/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
dqa = "dataset_quality_auditor.cli:app"

[tool.setuptools.packages.find]
include = ["dataset_quality_auditor*"]

[tool.setuptools.package-data]
dataset_quality_auditor = ["reports/templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-run -p no:cacheprovider"
testpaths = ["tests"]

[tool.coverage.run]
source = ["dataset_quality_auditor"]
omit = [
    "tests/*",
    ".pytest-run/*",
    ".pytest-tmp/*",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dataset_quality_auditor"]
known-third-party = ["tests"]
